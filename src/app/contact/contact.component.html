<section id="contact" class="border border-gray-200 rounded-lg shadow-lg overflow-hidden mb-6">
  <h2 class="text-2xl font-bold mb-4">Contact Us</h2>
  <p class="mb-6" style="color: var(--text-secondary)">
    Have questions or want to work together? Fill out the form below and we'll
    get back to you as soon as possible.
  </p>

  <!-- Success state -->
  <div *ngIf="submitted" class="success-banner">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polyline points="20 6 9 17 4 12"></polyline>
    </svg>
    <span>Message sent! We'll get back to you soon.</span>
    <button (click)="resetForm()" class="success-reset">Send another</button>
  </div>

  <!-- Error message -->
  <div *ngIf="submitError" class="error-banner">{{ submitError }}</div>

  <!-- Form -->
  <form *ngIf="!submitted" [formGroup]="contactForm" class="space-y-4">
    <div>
      <label for="name" class="block text-sm font-medium mb-1">Name</label>
      <input formControlName="name" type="text" id="name" placeholder="Your Name"
        class="mt-1 w-full rounded-md p-2.5" />
    </div>

    <div>
      <label for="email" class="block text-sm font-medium mb-1">Email</label>
      <input formControlName="email" type="email" id="email" placeholder="Your Email"
        class="mt-1 w-full rounded-md p-2.5" />
    </div>

    <div>
      <label for="message" class="block text-sm font-medium mb-1">Message</label>
      <textarea formControlName="message" id="message" rows="4" placeholder="Your Message"
        class="mt-1 w-full rounded-md p-2.5"></textarea>
    </div>

    <div class="submit-wrapper">
      <button (click)="onSave()" type="submit" [disabled]="contactForm.invalid || submitting" class="submit-btn">
        <span *ngIf="!submitting">Send Message</span>
        <span *ngIf="submitting">Sending...</span>
      </button>
      <a
        href="https://wa.me/917710122271?text=Hi%207Hive%2C%20I%27d%20like%20to%20enquire%20about%20your%20services"
        target="_blank"
        rel="noopener noreferrer"
        class="whatsapp-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
        </svg>
        WhatsApp
      </a>
    </div>

  </form>
</section>
